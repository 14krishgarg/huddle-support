<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Huddle</title>
<meta name="description" content="Huddle: seven party games for your friend group. Get it on iPhone or Android.">
<meta property="og:title" content="Huddle: Party Games IRL">
<meta property="og:description" content="Seven party games starring your actual friends. Pass one phone or play on everyone's.">
<script>
  // One link for every bio and post: phones go straight to their store.
  // ?ct=<campaign> is passed through: App Store campaign token / Play referrer.
  (function () {
    var q = new URLSearchParams(location.search);
    var ct = q.get('ct');
    // Apple only attributes ct when the provider token (pt, from App Store
    // Connect → App Analytics → Campaigns) comes with it.
    var pt = q.get('pt');
    var ios = 'https://apps.apple.com/app/id6792619285' + (ct && pt ? '?pt=' + encodeURIComponent(pt) + '&ct=' + encodeURIComponent(ct) + '&mt=8' : '');
    var play = 'https://play.google.com/store/apps/details?id=com.krishgarg14.huddle' + (ct ? '&referrer=' + encodeURIComponent('utm_source=' + ct) : '');
    var ua = navigator.userAgent || '';
    var isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    var isAndroid = /Android/.test(ua);
    if (isIOS) location.replace(ios);
    else if (isAndroid) location.replace(play);
    window.HUDDLE_LINKS = { ios: ios, play: play };
  })();
</script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0B0C0F;
         color: #F5F3EE; font-family: -apple-system, system-ui, "Segoe UI", sans-serif; padding: 2rem 1rem; text-align: center; }
  h1 { font-size: 3rem; font-weight: 900; letter-spacing: -0.045em; margin: 1rem 0 0.25rem; }
  p { color: #9BA1AD; margin: 0 0 2rem; }
  .row { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
  a.btn { display: inline-block; min-width: 12rem; padding: 0.9rem 1.4rem; border-radius: 999px; font-weight: 700;
          text-decoration: none; color: #F5F3EE; background: #1C1E25; border: 1.5px solid #262933; }
  a.btn:hover { border-color: #5C616C; }
</style></head><body>
<main>
  <svg width="96" height="96" viewBox="0 0 1024 1024" aria-hidden="true">
    <circle cx="512" cy="301" r="176" fill="#FF6F87"/><circle cx="732" cy="461" r="176" fill="#FFB03C"/>
    <circle cx="648" cy="722" r="176" fill="#57DA8D"/><circle cx="375" cy="722" r="176" fill="#48B8EF"/>
    <circle cx="291" cy="461" r="176" fill="#A87EFF"/>
  </svg>
  <h1>Huddle</h1>
  <p>Seven party games starring your actual friends.</p>
  <div class="row">
    <a class="btn" id="ios" href="https://apps.apple.com/app/id6792619285">iPhone &amp; iPad</a>
    <a class="btn" id="play" href="https://play.google.com/store/apps/details?id=com.krishgarg14.huddle">Android</a>
  </div>
</main>
<script>
  // Keep the campaign token on the desktop buttons too.
  document.getElementById('ios').href = window.HUDDLE_LINKS.ios;
  document.getElementById('play').href = window.HUDDLE_LINKS.play;
</script>
</body></html>
